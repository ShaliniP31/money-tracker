apiVersion: apps/v1
kind: Deployment
metadata:
  name: money-tracker-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: money-tracker-backend
  template:
    metadata:
      labels:
        app: money-tracker-backend
    spec:
      containers:
      - name: backend
        image: local-registry/money-tracker-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: money-tracker-backend-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: money-tracker-backend
  ports:
  - port: 8080
    targetPort: 8080