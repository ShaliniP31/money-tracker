apiVersion: apps/v1
kind: Deployment
metadata:
  name: money-tracker-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: money-tracker-frontend
  template:
    metadata:
      labels:
        app: money-tracker-frontend
    spec:
      containers:
      - name: money-tracker-frontend
        image: shalini31/money-tracker-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: money-tracker-frontend-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: money-tracker-frontend
  ports:
  - port: 80
    targetPort: 80