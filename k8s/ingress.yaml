apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: money-tracker-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - host: money-tracker-app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: money-tracker-frontend-svc
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: money-tracker-backend-svc
                port:
                  number: 8080