name: Build and Deploy to Local Rancher

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted # Targets your local machine runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t money-tracker-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t money-tracker-frontend:latest ./frontend

      - name: Apply Kubernetes Manifests
        run: |
          # Apply Deployments and Services
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          
          # Apply the Common Ingress Routing Rule
          kubectl apply -f k8s/ingress.yaml
          
          # Trigger rollout restarts to pull the newly built local images
          kubectl rollout restart deployment/money-tracker-backend
          kubectl rollout restart deployment/money-tracker-frontend