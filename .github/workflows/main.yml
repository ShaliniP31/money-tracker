name: Build and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted # Targets your local machine runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Docker Image
        run: |
          docker build --no-cache -f backend/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/money-tracker-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/money-tracker-backend:latest

      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/money-tracker-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/money-tracker-frontend:latest

      - name: Apply Kubernetes Manifests
        run: |
          # Apply Deployments and Services
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          
          # Apply the Common Ingress Routing Rule
          kubectl apply -f k8s/ingress.yaml
          
          # Trigger rollout restarts to pull the newly built local images
          kubectl rollout restart deployment/money-tracker-backend
          kubectl rollout restart deployment/money-tracker-frontend